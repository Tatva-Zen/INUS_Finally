version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8888:8000"
    volumes:
      - test-db:/app/db
    environment:
      - LLM_MOCK=true
      - MASSIVE_API_KEY=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  test-db:
